[advisories]
ignore = [
    "RUSTSEC-2024-0436", # unmaintained crate paste
    "RUSTSEC-2026-0192", # unmaintained crate ttf-parser (via ab_glyph)
]

[licenses]
confidence-threshold = 0.925
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "MIT",
    "NCSA",
    "Unlicense",
    "Zlib",
    "Unicode-3.0",
]
exceptions = [
    { name = "mp4parse", allow = ["MPL-2.0"] },
]

[[licenses.clarify]]
name = "exr"
expression = "BSD-3-Clause"
license-files = [
    { path = "LICENSE.md", hash = 0xf0600744 },
]
